<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d1440">
<title>Misi Petualangan Kata — 1000+ Soal Literasi Bahasa Inggris</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#1f2340;
  --muted:#6b7194;
  --brand:#6c5ce7;
  --brand-dark:#4534b8;
  --good:#22c55e;
  --bad:#ef4444;
  --amber:#f59e0b;
}
html,body{height:100%}
body{
  font-family:'Segoe UI Rounded','Trebuchet MS',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  color:#fff;
  background:
    radial-gradient(1100px 750px at 12% 8%, rgba(108,92,231,.55) 0%, transparent 62%),
    radial-gradient(950px 700px at 88% 92%, rgba(0,194,168,.42) 0%, transparent 62%),
    radial-gradient(700px 600px at 70% 15%, rgba(236,72,153,.28) 0%, transparent 60%),
    linear-gradient(160deg,#150d2e 0%, #1d1440 45%, #0e0a20 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  touch-action:manipulation;
  min-height:100dvh;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9999}
#app{position:relative;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(10px,1.6vw,22px)}
.screen{display:none;flex:1;flex-direction:column;animation:fadeUp .35s ease}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none !important}

/* ---------- BUTTONS ---------- */
.btn{
  font-family:inherit;font-weight:800;font-size:clamp(15px,1.4vw,19px);
  border:none;border-radius:999px;padding:15px 32px;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  letter-spacing:.3px;
}
.btn:active{transform:translateY(3px) scale(.99)}
.btn.primary{
  background:linear-gradient(180deg,#8a7bff,#5b47d6);color:#fff;
  box-shadow:0 8px 0 var(--brand-dark), 0 14px 30px rgba(108,92,231,.5);
}
.btn.primary:active{box-shadow:0 3px 0 var(--brand-dark), 0 6px 16px rgba(108,92,231,.45)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.28)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn.big{font-size:clamp(19px,2vw,26px);padding:20px 48px}
.btn.small{font-size:14px;padding:11px 20px}

/* ---------- HOME ---------- */
#screen-home{align-items:center;justify-content:center;text-align:center;overflow-y:auto}
.home-card{
  width:min(1000px,97vw);
  background:rgba(255,255,255,.97);
  color:var(--ink);
  border-radius:32px;
  padding:clamp(18px,2.6vw,36px) clamp(18px,3vw,44px);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  position:relative;overflow:hidden;
  animation:popIn .5s cubic-bezier(.2,1.3,.5,1);
  margin:auto;
}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.home-card::before{
  content:"";position:absolute;inset:-40% -10% auto -10%;height:240px;
  background:linear-gradient(90deg,#6c5ce7,#00c2a8,#f59e0b,#ec4899,#6c5ce7);
  background-size:300% 100%;filter:blur(70px);opacity:.3;
  animation:slide 14s linear infinite;
}
@keyframes slide{to{background-position:300% 0}}
.logo{font-size:clamp(40px,5vw,64px);line-height:1;position:relative;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.home-card h1{
  position:relative;font-size:clamp(24px,3.3vw,40px);line-height:1.1;margin:8px 0 4px;
  background:linear-gradient(90deg,#5b47d6,#00a58f,#5b47d6);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:slide 8s linear infinite;letter-spacing:-.5px;
}
.lead{position:relative;color:var(--muted);font-size:clamp(13px,1.4vw,17px);font-weight:700;margin-bottom:clamp(14px,2vw,22px)}
.sec-label{
  position:relative;display:flex;align-items:center;gap:10px;
  font-size:clamp(12px,1.2vw,14px);font-weight:900;color:#8b90b8;
  text-transform:uppercase;letter-spacing:1.4px;margin-bottom:10px;
}
.sec-label::after{content:"";flex:1;height:2px;background:#eef0fb;border-radius:2px}
.choice{position:relative;margin-bottom:clamp(12px,1.8vw,20px);text-align:left}

/* level grid */
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.level-grid{grid-template-columns:repeat(2,1fr)}}
.level-card{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:12px 6px 10px;border-radius:16px;border:3px solid #e6e9f9;background:#f8f9ff;
  cursor:pointer;font-family:inherit;transition:.16s;overflow:hidden;
}
.level-card .bar{position:absolute;top:0;left:0;right:0;height:5px;background:var(--c);opacity:.35;transition:.16s}
.level-card .lv-emoji{font-size:clamp(20px,2.4vw,26px);line-height:1.2}
.level-card .lv-name{font-weight:900;font-size:clamp(13px,1.3vw,16px);color:#1f2340}
.level-card .lv-en{font-size:10px;font-weight:800;color:#9aa0c0;text-transform:uppercase;letter-spacing:1px}
.level-card .lv-count{font-size:10px;font-weight:800;color:#b6bad6;margin-top:1px}
.level-card:hover{transform:translateY(-3px);border-color:#cdd3f2}
.level-card.sel{
  border-color:var(--c);background:#fff;
  box-shadow:0 10px 26px rgba(0,0,0,.13), 0 0 0 5px rgba(108,92,231,.07);
  transform:translateY(-4px);
}
.level-card.sel .bar{opacity:1;height:6px}

/* pills row */
.pill-row{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  font-family:inherit;cursor:pointer;font-weight:900;
  border-radius:14px;border:3px solid #e6e9f9;background:#f8f9ff;color:#1f2340;
  padding:12px 24px;font-size:clamp(14px,1.4vw,18px);transition:.15s;
  display:flex;align-items:center;gap:8px;
}
.chip:hover{transform:translateY(-2px);border-color:#cdd3f2}
.chip.sel{border-color:var(--brand);background:linear-gradient(180deg,#f2efff,#e6e0ff);box-shadow:0 0 0 5px rgba(108,92,231,.12)}
.chip .c-sub{font-size:.75em;font-weight:800;color:#8b90b8}

.start-row{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.bank-info{position:relative;margin-top:14px;font-size:13px;font-weight:800;color:#9aa0c0}
.bank-info b{color:#5b47d6}

/* ---------- GAME ---------- */
#screen-game{gap:clamp(8px,1.2vw,14px)}
.topbar{display:flex;align-items:center;gap:clamp(8px,1.2vw,16px)}
.pill{
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.22);
  border-radius:999px;padding:9px 18px;font-weight:800;
  font-size:clamp(12px,1.3vw,16px);white-space:nowrap;backdrop-filter:blur(6px);
}
.pill.lv{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4)}
.progress{flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;border:2px solid rgba(255,255,255,.18)}
.progress-fill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#00c2a8,#6c5ce7,#ec4899);
  background-size:200% 100%;
  transition:width .4s cubic-bezier(.4,1.4,.5,1);
  animation:slide 4s linear infinite;
}
.icon-btn{cursor:pointer;padding:8px 14px;font-size:18px;line-height:1;transition:.15s}
.icon-btn:active{transform:scale(.92)}

.teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.team-chip{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.10);border:3px solid rgba(255,255,255,.16);
  border-radius:999px;padding:6px 20px;font-weight:800;
  font-size:clamp(13px,1.5vw,18px);transition:.25s;
}
.team-chip.active{
  background:rgba(255,255,255,.22);border-color:#ffd76a;
  box-shadow:0 0 0 6px rgba(255,215,106,.16), 0 10px 30px rgba(0,0,0,.3);
  transform:scale(1.05);
}
.t-score{background:#ffd76a;color:#3d2c00;border-radius:999px;padding:1px 14px;min-width:52px;text-align:center}
.turn-banner{text-align:center;font-weight:900;font-size:clamp(14px,1.7vw,21px);color:#ffd76a;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}

.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.card{
  width:min(1120px,100%);
  background:rgba(255,255,255,.98);color:var(--ink);
  border-radius:26px;padding:clamp(16px,2.4vw,34px);
  box-shadow:0 26px 70px rgba(0,0,0,.45);
  animation:cardIn .4s cubic-bezier(.2,1.2,.4,1);
  max-height:100%;overflow:auto;
}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.tag{
  display:inline-block;background:linear-gradient(180deg,#f0edff,#e3ddff);color:#5b47d6;
  font-weight:900;font-size:clamp(11px,1.1vw,13px);letter-spacing:1.1px;
  text-transform:uppercase;padding:7px 16px;border-radius:999px;margin-bottom:12px;
}
.q-prompt{font-size:clamp(19px,2.6vw,34px);line-height:1.3;font-weight:800;letter-spacing:-.3px;margin-bottom:8px}
.q-sub{color:var(--muted);font-weight:700;font-size:clamp(12px,1.3vw,16px);margin-bottom:clamp(12px,2vw,22px)}

.options{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1.2vw,14px)}
@media(max-width:820px){.options{grid-template-columns:1fr}}
.option{
  font-family:inherit;display:flex;align-items:center;gap:14px;text-align:left;
  background:#f7f8ff;border:3px solid #e2e6f7;border-radius:16px;
  padding:clamp(11px,1.4vw,18px) clamp(12px,1.6vw,22px);
  font-size:clamp(14px,1.6vw,21px);font-weight:700;color:var(--ink);
  cursor:pointer;transition:.15s;line-height:1.28;
}
.option:hover:not(.disabled){border-color:var(--brand);background:#f0edff;transform:translateY(-3px);box-shadow:0 10px 24px rgba(108,92,231,.18)}
.option.disabled{cursor:default}
.opt-letter{
  flex:0 0 auto;width:clamp(28px,2.9vw,40px);height:clamp(28px,2.9vw,40px);
  border-radius:10px;background:linear-gradient(180deg,#8a7bff,#5b47d6);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(13px,1.4vw,18px);
}
.option.correct{background:#dcfce7;border-color:var(--good);animation:bounce .45s cubic-bezier(.2,1.6,.4,1)}
.option.correct .opt-letter{background:var(--good)}
.option.wrong{background:#fee2e2;border-color:var(--bad);animation:shake .4s}
.option.wrong .opt-letter{background:var(--bad)}
@keyframes bounce{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vw,22px)}
.slot{
  width:clamp(36px,4vw,56px);height:clamp(44px,4.8vw,64px);
  border-radius:12px;background:#eef1ff;border:3px dashed #b9c2ef;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(18px,2.3vw,29px);font-weight:900;color:#3b3f7a;transition:.18s;
}
.slot.filled{background:#fff;border-style:solid;border-color:var(--brand);animation:bounce .3s}
.slot.correct{background:#dcfce7;border-color:var(--good);color:#15803d;border-style:solid}
.slot.wrong{background:#fee2e2;border-color:var(--bad);color:#b91c1c;border-style:solid;animation:shake .4s}
.tiles{display:flex;gap:clamp(6px,1vw,12px);justify-content:center;flex-wrap:wrap}
.tile{
  width:clamp(42px,4.4vw,62px);height:clamp(42px,4.4vw,62px);
  border-radius:16px;border:none;background:linear-gradient(180deg,#8a7bff,#5b47d6);
  color:#fff;font-family:inherit;font-size:clamp(18px,2.3vw,29px);font-weight:900;
  cursor:pointer;box-shadow:0 6px 0 var(--brand-dark);
  transition:transform .1s, box-shadow .1s, opacity .15s;
}
.tile:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--brand-dark)}
.tile.used{opacity:.2;box-shadow:none;transform:translateY(5px);cursor:default}
.ana-actions{display:flex;justify-content:center;margin-top:16px}

.footer{display:flex;justify-content:space-between;gap:12px;align-items:center}
@media(max-width:820px){.footer{flex-direction:column-reverse}.footer .btn{width:100%}}

.toast{
  position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);
  background:#fff;color:var(--ink);font-weight:900;font-size:clamp(15px,1.8vw,22px);
  padding:14px 30px;border-radius:999px;box-shadow:0 18px 50px rgba(0,0,0,.4);
  z-index:10000;transition:transform .35s cubic-bezier(.2,1.5,.4,1);
  display:flex;align-items:center;gap:10px;white-space:nowrap;
}
.toast.show{transform:translate(-50%,0)}
.toast.ok{background:linear-gradient(180deg,#4ade80,#22c55e);color:#06331a}
.toast.no{background:linear-gradient(180deg,#fca5a5,#ef4444);color:#3b0000}

/* ---------- RESULT ---------- */
#screen-result{align-items:center;justify-content:center;overflow-y:auto}
.result-card{
  width:min(760px,96vw);background:rgba(255,255,255,.98);color:var(--ink);
  border-radius:32px;padding:clamp(22px,3.4vw,44px);text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.5);animation:popIn .5s cubic-bezier(.2,1.3,.5,1);
  margin:auto;
}
.badge-emoji{font-size:clamp(54px,8vw,96px);line-height:1;animation:bob 2.4s ease-in-out infinite}
.result-card h1{
  font-size:clamp(23px,3.2vw,40px);margin:6px 0 6px;
  background:linear-gradient(90deg,#5b47d6,#00a58f,#5b47d6);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:slide 8s linear infinite;
}
.result-lv{
  display:inline-block;background:#f0edff;color:#5b47d6;font-weight:900;
  font-size:13px;letter-spacing:1.2px;text-transform:uppercase;
  padding:6px 18px;border-radius:999px;margin-bottom:10px;
}
.result-sub{color:var(--muted);font-weight:700;font-size:clamp(13px,1.6vw,18px);margin-bottom:18px}
.final-score{
  display:inline-flex;align-items:baseline;gap:10px;
  background:linear-gradient(180deg,#f0edff,#e2dcff);
  border-radius:22px;padding:10px 36px;margin-bottom:22px;
}
.final-score span{font-size:clamp(36px,5.4vw,64px);font-weight:900;color:#5b47d6;line-height:1}
.final-score small{font-size:clamp(13px,1.6vw,19px);font-weight:800;color:var(--muted)}
.team-results{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.tr-item{background:#f7f8ff;border:3px solid #e2e6f7;border-radius:18px;padding:12px 26px;font-weight:800;font-size:clamp(14px,1.7vw,20px)}
.tr-item .tr-score{display:block;font-size:clamp(22px,2.8vw,34px);color:#5b47d6;margin-top:2px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.result-actions .btn.ghost{color:var(--ink);border-color:#d7dcf3;background:#f7f8ff}
.result-actions .btn.ghost:hover{background:#ecefff}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<main id="app">

  <!-- ================= HOME ================= -->
  <section class="screen active" id="screen-home">
    <div class="home-card">
      <div class="logo">🎯</div>
      <h1>Misi Petualangan Kata</h1>
      <p class="lead">1000+ Soal Literasi Bahasa Inggris • 6 Tingkat • Kelas 7 SMP</p>

      <div class="choice">
        <div class="sec-label">1. Pilih Tingkat</div>
        <div class="level-grid" id="levelGrid"></div>
      </div>

      <div class="choice">
        <div class="sec-label">2. Jumlah Soal</div>
        <div class="pill-row" id="countRow">
          <button class="chip sel" data-count="10">10 <span class="c-sub">soal</span></button>
          <button class="chip" data-count="25">25 <span class="c-sub">soal</span></button>
          <button class="chip" data-count="50">50 <span class="c-sub">soal</span></button>
          <button class="chip" data-count="100">100 <span class="c-sub">soal</span></button>
        </div>
      </div>

      <div class="choice">
        <div class="sec-label">3. Mode Bermain</div>
        <div class="pill-row" id="modeRow">
          <button class="chip sel" data-mode="solo">🧑 Solo</button>
          <button class="chip" data-mode="team">👥 2 Tim</button>
        </div>
      </div>

      <div class="start-row">
        <button class="btn primary big" id="btnStart">🚀 Mulai Bermain</button>
      </div>
      <p class="bank-info" id="bankInfo"></p>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section class="screen" id="screen-game">
    <div class="topbar">
      <div class="pill lv" id="lvPill">🌱 Dasar</div>
      <div class="pill" id="qCounter">1 / 10</div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <button class="pill icon-btn" id="btnMute" title="Suara">🔊</button>
    </div>

    <div class="teams" id="teamsBar"></div>
    <div class="turn-banner hidden" id="turnBanner"></div>

    <div class="stage">
      <div class="card" id="questionCard">
        <div class="tag" id="qTag">📚</div>
        <h2 class="q-prompt" id="qPrompt"></h2>
        <p class="q-sub" id="qSub"></p>
        <div class="options" id="options"></div>
        <div class="anagram-area hidden" id="anagramArea"></div>
      </div>
    </div>

    <div class="footer">
      <button class="btn ghost" id="btnQuit">🏠 Keluar</button>
      <button class="btn primary hidden" id="btnNext">Lanjut →</button>
    </div>
  </section>

  <!-- ================= RESULT ================= -->
  <section class="screen" id="screen-result">
    <div class="result-card">
      <div class="badge-emoji" id="badgeEmoji">🏆</div>
      <div class="result-lv" id="resultLevel">Dasar</div>
      <h1 id="badgeTitle">Literacy Hero</h1>
      <p class="result-sub" id="resultSub"></p>
      <div class="final-score"><span id="finalScore">0</span><small>poin</small></div>
      <div class="team-results" id="teamResults"></div>
      <div class="result-actions">
        <button class="btn primary" id="btnAgain">🔁 Main Lagi</button>
        <button class="btn ghost" id="btnHome">🏠 Menu Utama</button>
      </div>
    </div>
  </section>

</main>

<script>
/* ==================================================================
   0. DEFINISI TINGKAT
   ================================================================== */
const LEVELS = [
  {id:'dasar',    name:'Dasar',    en:'Beginner',          emoji:'🌱', color:'#22c55e'},
  {id:'pemula',   name:'Pemula',   en:'Elementary',        emoji:'🐣', color:'#06b6d4'},
  {id:'menengah', name:'Menengah', en:'Intermediate',      emoji:'🚀', color:'#6c5ce7'},
  {id:'lancar',   name:'Lancar',   en:'Upper-Intermediate',emoji:'⚡', color:'#f59e0b'},
  {id:'mahir',    name:'Mahir',    en:'Advanced',          emoji:'🎓', color:'#ec4899'},
  {id:'ahli',     name:'Ahli',     en:'Expert',            emoji:'👑', color:'#ef4444'}
];

/* ==================================================================
   1. BANK KATA PER TINGKAT
   format: { w:word, d:definition, c:category, e:example with ___, h:hint id }
   ================================================================== */
const DATA = {

/* ---------------- DASAR (Beginner) ---------------- */
dasar: [
{w:"red",       d:"the color of a tomato",                       c:"Colors",       e:"My favorite color is ___.",                       h:"merah"},
{w:"blue",      d:"the color of the sky on a clear day",         c:"Colors",       e:"The sea looks ___ today.",                        h:"biru"},
{w:"green",     d:"the color of leaves and grass",               c:"Colors",       e:"The leaves turn ___ in spring.",                  h:"hijau"},
{w:"yellow",    d:"the color of the sun and bananas",            c:"Colors",       e:"She has a ___ bag.",                              h:"kuning"},
{w:"black",     d:"the color of night and coal",                 c:"Colors",       e:"My shoes are ___.",                               h:"hitam"},
{w:"white",     d:"the color of milk and snow",                  c:"Colors",       e:"The teacher writes on a ___ board.",              h:"putih"},
{w:"cat",       d:"a small animal that says meow",               c:"Animals",      e:"My ___ sleeps on the sofa.",                      h:"kucing"},
{w:"dog",       d:"an animal that barks and wags its tail",      c:"Animals",      e:"The ___ runs in the yard.",                       h:"anjing"},
{w:"fish",      d:"an animal that lives in water",               c:"Animals",      e:"There are many ___ in the river.",                h:"ikan"},

/* ==================================================================
   3. UTILITAS
   ================================================================== */
const $ = s => document.querySelector(s);
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function uniqBy(arr, keyFn){
  const seen = new Set();
  return arr.filter(x=>{
    const k = keyFn(x);
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

/* ==================================================================
   4. PEMBANGUN BANK SOAL
   ================================================================== */
function pickDefs(entries, e, n){
  const seen = new Set([e.d.toLowerCase()]);
  const out = [];
  const same = shuffle(entries.filter(x => x !== e && x.c === e.c));
  const rest = shuffle(entries.filter(x => x !== e && x.c !== e.c));
  for(const x of same.concat(rest)){
    const k = x.d.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k); out.push(x.d);
    if(out.length === n) break;
  }
  return out;
}
function pickWords(entries, e, n, diffCat){
  const seen = new Set([e.w.toLowerCase()]);
  const out = [];
  const same = shuffle(entries.filter(x => x !== e && x.c === e.c));
  const rest = shuffle(entries.filter(x => x !== e && x.c !== e.c));
  const pool = diffCat ? rest.concat(same) : same.concat(rest);
  for(const x of pool){
    const k = x.w.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k); out.push(x.w);
    if(out.length === n) break;
  }
  return out;
}

function buildLevel(levelId, entries){
  const qs = [];
  const cats = [...new Set(entries.map(e => e.c).filter(Boolean))];

  entries.forEach(e => {
    // A. Kata -> Arti
    const defs = pickDefs(entries, e, 3);
    if(defs.length === 3){
      const options = shuffle([e.d, ...defs]);
      qs.push({
        level: levelId, type: 'mc',
        tag: '📚 Arti Kata',
        prompt: `What does “${e.w}” mean?`,
        sub: 'Pilih arti yang paling tepat dalam bahasa Inggris.',
        options, answer: options.indexOf(e.d)
      });
    }

    // B. Arti -> Kata
    const ws = pickWords(entries, e, 3, false);
    if(ws.length === 3){
      const options = shuffle([e.w, ...ws]);
      qs.push({
        level: levelId, type: 'mc',
        tag: '🔎 Cari Kata',
        prompt: `Which word means “${e.d}”?`,
        sub: 'Pilih kata yang sesuai dengan arti di atas.',
        options, answer: options.indexOf(e.w)
      });
    }

    // C. Lengkapi kalimat (distraktor beda kategori agar tidak ambigu)
    if(e.e){
      const dw = pickWords(entries, e, 3, true);
      if(dw.length === 3){
        const options = shuffle([e.w, ...dw]);
        qs.push({
          level: levelId, type: 'mc',
          tag: '✏️ Lengkapi Kalimat',
          prompt: e.e,
          sub: 'Pilih kata yang tepat untuk mengisi bagian rumpang.',
          options, answer: options.indexOf(e.w)
        });
      }
    }

    // D. Kategori (hanya jika level punya ≥4 kategori)
    if(e.c && cats.length >= 4){
      const others = shuffle(cats.filter(c => c !== e.c)).slice(0, 3);
      if(others.length === 3){
        const options = shuffle([e.c, ...others]);
        qs.push({
          level: levelId, type: 'mc',
          tag: '🗂️ Kategori',
          prompt: `Which category does “${e.w}” belong to?`,
          sub: 'Pilih kategori yang paling tepat.',
          options, answer: options.indexOf(e.c)
        });
      }
    }

    // E. Anagram
    const lw = e.w.toLowerCase();
    if(/^[a-z]{3,10}$/.test(lw)){
      qs.push({
        level: levelId, type: 'anagram',
        tag: '🔤 Anagram',
        prompt: 'Susun huruf-huruf ini menjadi kata yang benar',
        sub: `Petunjuk: ${e.h}`,
        answer: e.w.toUpperCase()
      });
    }
  });

  return qs;
}

function buildBank(){
  const bank = {};
  LEVELS.forEach(lv => {
    const entries = uniqBy(DATA[lv.id] || [], x => x.w.toLowerCase());
    bank[lv.id] = buildLevel(lv.id, entries);
  });

  // Sinonim & Antonim
  SYN_ANT.forEach(p => {
    const entries = uniqBy(DATA[p.l] || [], x => x.w.toLowerCase());
    if(!entries.length) return;
    const pool = entries.map(x => x.w)
      .filter(w => w.toLowerCase() !== p.a.toLowerCase() && w.toLowerCase() !== p.b.toLowerCase());
    const distract = shuffle(pool).slice(0, 3);
    if(distract.length < 3) return;
    const options = shuffle([p.b, ...distract]);
    bank[p.l].push({
      level: p.l, type: 'mc',
      tag: p.t === 'syn' ? '🔁 Sinonim' : '↔️ Antonim',
      prompt: p.t === 'syn'
        ? `Which word is closest in meaning to “${p.a}”?`
        : `Which word is opposite in meaning to “${p.a}”?`,
      sub: p.t === 'syn'
        ? 'Pilih kata yang maknanya paling dekat.'
        : 'Pilih kata yang maknanya berlawanan.',
      options, answer: options.indexOf(p.b)
    });
  });

  return bank;
}

let audioCtx = null;
function beep(freq, dur, type='sine', vol=0.06, delay=0){
  if(state.muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime + delay;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}

function startGame(){
  const pool = BANK[state.level];
  const n = Math.min(state.count, pool.length);
  state.questions = shuffle(pool).slice(0, n);
  state.count = n;
  state.index = 0;
  state.correct = 0;
  state.answered = false;

  if(state.mode === 'team'){
    state.teams = [
      {name:'Tim Merah', emoji:'🔴', score:0},
      {name:'Tim Biru',  emoji:'🔵', score:0}
    ];
  }else{
    state.teams = [{name:'Kamu', emoji:'⭐', score:0}];
  }
  state.turn = 0;

  stopConfetti();
  showScreen('game');
  renderQuestion();
}

function renderQuestion(){
  const q = state.questions[state.index];
  if(!q) return;

  state.answered = false;
  state.turn = (state.mode === 'team') ? (state.index % 2) : 0;

  const lvObj = LEVELS.find(l => l.id === state.level);
  $('#lvPill').textContent = `${lvObj.emoji} ${lvObj.name}`;
  $('#qCounter').textContent = `${state.index + 1} / ${state.count}`;
  $('#progressFill').style.width = `${(state.index / state.count) * 100}%`;
  $('#btnNext').classList.add('hidden');

  $('#qTag').textContent = q.tag;
  $('#qPrompt').textContent = q.prompt;
  $('#qSub').textContent = q.sub || '';
  $('#qSub').style.display = q.sub ? 'block' : 'none';

  renderTeams();

  const optionsEl = $('#options');
  const anaEl = $('#anagramArea');
  optionsEl.innerHTML = '';
  anaEl.innerHTML = '';

  if(q.type === 'mc'){
    optionsEl.classList.remove('hidden');
    anaEl.classList.add('hidden');
    q.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'option';
      b.innerHTML = `<span class="opt-letter">${'ABCD'[i]}</span><span class="opt-text"></span>`;
      b.querySelector('.opt-text').textContent = opt;
      b.addEventListener('click', () => selectMC(i, b));
      optionsEl.appendChild(b);
    });
  }else{
    optionsEl.classList.add('hidden');
    anaEl.classList.remove('hidden');
    renderAnagram(q);
  }

  const card = $('#questionCard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
}

  state.teams.forEach((t, i) => {
    const d = document.createElement('div');

    d.innerHTML = `<span>${t.emoji}</span><span>${t.name}</span><span class="t-score">${t.score}</span>`;

  }

  if(state.answered) return;
  state.answered = true;

  const q = state.questions[state.index];
  const all = Array.from($('#options').children);
  all.forEach(b => b.classList.add('disabled'));

  if(i === q.answer){
    btn.classList.add('correct');
    onCorrect();
  }else{
    btn.classList.add('wrong');
    all[q.answer].classList.add('correct');
    onWrong();
  }
  finishQuestion();
}

/* ==================================================================
   12. ANAGRAM
   ================================================================== */
function renderAnagram(q){
  const area = $('#anagramArea');
  const tiles = shuffle(q.answer.split('')).map((ch, i) => ({ch, id:i}));
  state.ana = {tiles, built:[]};

  area.innerHTML = `
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
    <div class="ana-actions">
      <button class="btn ghost small" id="btnUndo" style="color:#1f2340;border-color:#d7dcf3;background:#f7f8ff">⌫ Hapus</button>
    </div>`;

  $('#btnUndo').addEventListener('click', () => {
    if(state.answered) return;
    if(state.ana.built.length){
      state.ana.built.pop();
      soundClick();
      paintAnagram();
    }
  });

  paintAnagram();
}

function paintAnagram(){
  const q = state.questions[state.index];
  const {tiles, built} = state.ana;
  const target = q.answer;

  const slots = $('#slots');
  slots.innerHTML = '';
  for(let i = 0; i < target.length; i++){
    const d = document.createElement('div');
    const id = built[i];
    const filled = id !== undefined;
    d.className = 'slot' + (filled ? ' filled' : '');
    if(filled) d.textContent = tiles.find(t => t.id === id).ch;
    slots.appendChild(d);
  }

  const tilesEl = $('#tiles');
  tilesEl.innerHTML = '';
  tiles.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tile' + (built.includes(t.id) ? ' used' : '');
    b.textContent = t.ch;
    b.disabled = built.includes(t.id) || state.answered;
    b.addEventListener('click', () => {
      if(state.answered) return;
      if(state.ana.built.includes(t.id)) return;
      state.ana.built.push(t.id);
      soundClick();
      paintAnagram();
      if(state.ana.built.length === target.length) checkAnagram();
    });
    tilesEl.appendChild(b);
  });
}

function checkAnagram(){
  const q = state.questions[state.index];
  const {tiles, built} = state.ana;
  const word = built.map(id => tiles.find(t => t.id === id).ch).join('');
  const ok = (word === q.answer);

  state.answered = true;
  paintAnagram();

  const slots = Array.from(document.querySelectorAll('.slot'));
  slots.forEach(s => s.classList.add(ok ? 'correct' : 'wrong'));

  if(ok){
    onCorrect();
  }else{
    onWrong();
    slots.forEach((s, i) => { s.textContent = q.answer[i]; });
  }
  finishQuestion();
}

/* ==================================================================
   13. HASIL JAWABAN
   ================================================================== */
function onCorrect(){
  state.correct++;
  state.teams[state.turn].score += 10;
  renderTeams();
  soundCorrect();
  showToast('✅ Benar! +10 poin', 'ok');
}
function onWrong(){
  soundWrong();
  showToast('❌ Belum tepat', 'no');
}
function finishQuestion(){
  $('#progressFill').style.width = `${((state.index + 1) / state.count) * 100}%`;
  const btn = $('#btnNext');
  btn.classList.remove('hidden');
  btn.textContent = (state.index + 1 >= state.count) ? 'Lihat Hasil 🏁' : 'Lanjut →';
}
function nextQuestion(){
  state.index++;
  if(state.index >= state.count){
    showResult();
  }else{
    renderQuestion();
  }
}

/* ==================================================================
   14. TOAST
   ================================================================== */
let toastTimer = null;
function showToast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast ' + (kind || ''); }, 1500);
}

/* ==================================================================
   15. HASIL AKHIR
   ================================================================== */
function showResult(){
  const pct = state.correct / state.count;
  let emoji = '🌱', title = 'Terus Semangat!';
  if(pct >= 0.9){ emoji = '🏆'; title = 'Literacy Hero'; }
  else if(pct >= 0.75){ emoji = '🥇'; title = 'Vocabulary Champion'; }
  else if(pct >= 0.6){ emoji = '🥈'; title = 'Word Explorer'; }
  else if(pct >= 0.4){ emoji = '🥉'; title = 'Word Learner'; }

  const lvObj = LEVELS.find(l => l.id === state.level);

  $('#badgeEmoji').textContent = emoji;
  $('#resultLevel').textContent = `${lvObj.emoji} Level ${lvObj.name}`;
  $('#badgeTitle').textContent = title;
  $('#resultSub').textContent =
    `Kamu menjawab ${state.correct} dari ${state.count} soal dengan benar (${Math.round(pct * 100)}%).`;
  $('#finalScore').textContent = state.correct * 10;

  const tr = $('#teamResults');
  tr.innerHTML = '';
  if(state.mode === 'team'){
    state.teams.forEach(t => {
      const d = document.createElement('div');
      d.className = 'tr-item';
      d.innerHTML = `${t.emoji} ${t.name}<span class="tr-score">${t.score}</span>`;
      tr.appendChild(d);
    });
  }else{
    const d = document.createElement('div');
    d.className = 'tr-item';
    d.innerHTML = `⭐ Skor Akhir<span class="tr-score">${state.correct * 10}</span>`;
    tr.appendChild(d);
  }

  showScreen('result');
  soundWin();
  startConfetti();
}

/* ==================================================================
   16. CONFETTI
   ================================================================== */
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
let fxParticles = [];
let fxRunning = false;

function fxResize(){
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', fxResize);
fxResize();

function startConfetti(){
  const colors = ['#6c5ce7','#00c2a8','#f59e0b','#ef4444','#3b82f6','#ec4899','#22c55e','#a78bfa'];
  fxParticles = [];
  for(let i = 0; i < 160; i++){
    fxParticles.push({
      x: Math.random() * fxCanvas.width,
      y: -30 - Math.random() * fxCanvas.height * 0.7,
      vx: (Math.random() - 0.5) * 2.4,
      vy: 2 + Math.random() * 4.5,
      size: 6 + Math.random() * 10,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.22
    });
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(fxLoop); }
}

function fxLoop(){
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fxParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.rot += p.vr;
    fxCtx.save();
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.color;
    fxCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.62);
    fxCtx.restore();
  });
  fxParticles = fxParticles.filter(p => p.y < fxCanvas.height + 50);
  if(fxParticles.length){
    requestAnimationFrame(fxLoop);
  }else{
    fxRunning = false;
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
}

function stopConfetti(){
  fxParticles = [];
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
}

/* ==================================================================
   17. EVENT BINDING
   ================================================================== */
document.querySelectorAll('#countRow .chip').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#countRow .chip').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    state.count = parseInt(b.dataset.count, 10);
    soundClick();
  });
});

document.querySelectorAll('#modeRow .chip').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#modeRow .chip').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    state.mode = b.dataset.mode;
    soundClick();
  });
});

$('#btnStart').addEventListener('click', () => { soundClick(); startGame(); });
$('#btnNext').addEventListener('click', () => { soundClick(); nextQuestion(); });
$('#btnQuit').addEventListener('click', () => { stopConfetti(); showScreen('home'); });
$('#btnAgain').addEventListener('click', () => { stopConfetti(); startGame(); });
$('#btnHome').addEventListener('click', () => { stopConfetti(); showScreen('home'); });

$('#btnMute').addEventListener('click', () => {
  state.muted = !state.muted;
  $('#btnMute').textContent = state.muted ? '🔇' : '🔊';
  if(!state.muted) soundClick();
});

/* ---- Keyboard untuk smartboard / laptop ---- */
document.addEventListener('keydown', (e) => {
  const gameActive = $('#screen-game').classList.contains('active');
  if(!gameActive) return;

  const q = state.questions[state.index];
  if(!q) return;

  if(!state.answered && q.type === 'mc'){
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= q.options.length){
      const btn = $('#options').children[n - 1];
      if(btn) btn.click();
    }
  }
  if(state.answered && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    nextQuestion();
  }
});
